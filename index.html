<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volleyball Scoreboard & Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section id="authSection" class="form-group">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="UserName / Email" required />
    <input type="password" id="password" placeholder="Password" required />
    
    <label for="user-role">Role</label>
    <select id="user-role">
      <option value="administrator">Administrator</option>
      <option value="coordinator">Coordinator</option>
      <option value="coach">Coach</option>
      <option value="player">Player</option>
      <option value="spectator">Spectator</option>
    </select>

    <button id="loginBtn">Login</button>
    <button id="logoutBtn" class="hidden">Logout</button>
    <p id="authError" class="error hidden"></p>
  </section>

  <main id="mainContent" class="hidden">
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="divisions">Divisions</button>
      <button class="tab-btn" data-tab="courts">Courts</button>
      <button class="tab-btn" data-tab="officials" id="tab-officials">Officials</button>
    </div>

    <div class="form-group">
      <label for="match-status">Status</label>
      <select id="match-status">
        <option value="Scheduled">Scheduled</option>
        <option value="Live">Live</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <section id="matchesList" class="matches-container">
      <div class="match-card" data-match-id="1">
        <div class="match-info">
          <strong>Tigers vs Dolphins</strong>
          <span>Set 1 - Tigers: 9.32.05</span>
        </div>
        <button class="swipe-bin-btn" title="Swipe right or click to delete">🗑️</button>
      </div>
    </section>

    <section id="projectionView" class="scoreboard">
      <div class="timer-display" id="matchTimer">07.23.04</div>

      <div class="team-panel away-panel">
        <div class="form-group">
          <label for="team-b">Away Team (Team B)</label>
          <input type="text" id="team-b" value="Away - Dolphins" required />
        </div>
        <div class="score-display" id="scoreTeamB">14</div>
        <button class="score-btn" id="btnIncTeamB">+1 Score</button>
      </div>

      <div class="team-panel home-panel">
        <div class="form-group">
          <label for="team-a">Home Team (Team A)</label>
          <input type="text" id="team-a" value="Home - Tigers" required />
        </div>
        <div class="score-display" id="scoreTeamA">08</div>
        <button class="score-btn" id="btnIncTeamA">+1 Score</button>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
